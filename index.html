<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <!-- This script tag bootstraps PyScript -->
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>2Q Drill 2</title>
</head>
<body>
    <div class="container mt-5">
        <h3 class="mb-4">Add new club member:</h3>
        <form class="mb-4">
            <div class="mb-3">
                <input type="text" id="first_name" class="form-control" placeholder="Enter first name">
            </div>
            <div class="mb-3">
                <input type="text" id="last_name" class="form-control" placeholder="Enter last name">
            </div>
            <input type="button" value="Submit" py-click="result_checker" class="btn btn-primary">
        </form>
        <div id="output" class="p-3 rounded" style="background-color: red;"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
